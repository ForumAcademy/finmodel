# Справочник регионов (89 субъектов РФ, коды ФНС).
# Заполнение: Москва и Санкт-Петербург — эталон; остальные субъекты имеют структуру и официальную точку входа
# (сервис ФНС по ставкам, таблица 1 НЦС для Кпер), а конкретные акты вносятся при первом проекте в регионе.
# Правило: пока поле region-параметра = null, модель требует ручной ввод с документом (status: project_input).
#
# ncs_k_per — коэффициент перехода от базового района (Московская обл.) к субъекту, таблица 1 НЦС 81-02-01-2026 (S_NCS_2026_01).
# land_tax_rate — ставка задаётся муниципалитетом по ОКТМО: брать через fns_rates_url (S_FNS_RATES), не на уровне субъекта.

