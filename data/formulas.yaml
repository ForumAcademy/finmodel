# Каталог формул расчётного ядра.
# Каждая формула — «паспорт»: что считаем, как, почему именно так, что отклонено, на чём основано, откуда пришло из исходника.
#
# Нотация выражений (язык-нейтральный псевдокод, реализуется 1:1 в packages/engine):
#   t            — индекс месяца (0..T-1), date[t] — последний день месяца
#   p            — очередь (phase), k — продукт/тип квартир, i — статья бюджета
#   X[t-1]       — значение в месяце t−1 (для t=0 → 0)
#   Σ_t, Σ_k     — суммы по индексу
#   ID параметров — из parameters.yaml, ID формул — F.*
#   1{условие}   — индикатор (1 если истина, иначе 0)
#
# Поля: id, module, name, unit, dims, expr, depends_on, rationale (почему так), rejected (какие варианты отклонены и почему),
#       source_ids, legacy (ячейки исходника и вердикт), status (verified | needs_verification), example (контрольный пример).
#   expr         — только формула (условия — ЕСЛИ / ИНАЧЕ); пояснения текстом — в note.
#   note         — необязательное пояснение словами (проверки, оговорки, ссылки на акты).
#   terms        — необязательная расшифровка промежуточных обозначений из expr («need[t]» → что это).
#   lag_depends_on — подмножество depends_on, для которого берётся значение прошлого месяца X[t-1]. Такие связи
#                    разрывают цикл в графе (ставка ПФ ← покрытие эскроу за t−1); любой другой цикл — ошибка валидатора.

formulas:

  # =====================================================================
  # TIME — временная шкала и флаги
  # =====================================================================

  - id: F.TIME.DATE
    module: TIME
    name: "Дата конца месяца t"
    plain:
      title: "Дата конца месяца расчёта"
      how: "Расчёт идёт по месяцам начиная с месяца даты начала модели. Каждому месяцу соответствует дата его последнего дня, к ней привязаны платежи и поступления месяца."
    unit: дата
    dims: [t]
    expr: "date[t] = EOMONTH(GEN.MODEL_START_DATE, t)"
    terms:
      "date[t]": "последний день месяца t"
    depends_on: [GEN.MODEL_START_DATE]
    rationale: "Единая месячная шкала для всех модулей; отчёты агрегируют месяцы в кварталы/годы"
    rejected:
      - "Квартальный шаг исходника: проценты и покрытие эскроу считаются грубо, раскрытие эскроу сдвигается до 3 месяцев"
    source_ids: [S_EXPERT]
    legacy: {cells: "CF1!E2:AS2", verdict: fix, issue: "F2 = EDATE, далее EOMONTH — разные функции в одном ряду"}
    status: verified

  - id: F.TIME.DAYS
    module: TIME
    name: "Дней в месяце t"
    plain:
      title: "Дней в месяце расчёта"
      how: "Число дней в каждом месяце расчёта. Нужно для процентов по кредиту и платежей, которые делятся пропорционально дням."
    unit: дни
    dims: [t]
    expr: |
      days[t] = date[t] − date[t−1]
      days[0] = DAY(date[0])
    terms:
      "days[t]": "число дней в месяце t"
      "date[t]": "последний день месяца t (F.TIME.DATE)"
      "DAY(x)": "номер дня в дате x"
    depends_on: [F.TIME.DATE]
    rationale: "Проценты по кредиту начисляются по фактическим дням (факт/365), как в кредитных договорах"
    rejected: []
    source_ids: [S_BANK_TERMSHEET]
    legacy: {cells: "CF1!F3:AS3", verdict: keep}
    status: verified

  - id: F.TIME.FLAG_CONSTRUCTION
    module: TIME
    name: "Флаг периода строительства очереди"
    plain:
      title: "Идёт ли стройка очереди в этом месяце"
      how: "Месяцы, когда идёт стройка очереди: от начала до окончания строительства по вехам проекта."
    unit: "0/1"
    dims: [p, t]
    expr: "flag_constr[p,t] = 1{ construction_start[p] <= date[t] < construction_end[p] }"
    terms:
      "flag_constr[p,t]": "1 — месяц t входит в период строительства очереди p, иначе 0"
      "construction_start[p]": "дата начала СМР очереди p (TIME.MILESTONES)"
      "construction_end[p]": "дата окончания СМР очереди p (TIME.MILESTONES)"
      "date[t]": "последний день месяца t (F.TIME.DATE)"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "Сравнение настоящих дат; определяет выборку ПФ и распределение СМР"
    rejected:
      - "Текстовые вехи исходника («4 кв 2025») — сравнение даты с текстом всегда ложно, флаги строки CF1!4–5 были нулевыми"
    source_ids: [S_GRK_51]
    legacy: {cells: "CF1!F4:AS5", verdict: fix, issue: "D4, D5 ссылаются на текст ТЭПы!C7, C9"}
    status: verified

  - id: F.TIME.FLAG_PRESALE
    module: TIME
    name: "Флаг продаж по ДДУ (эскроу)"
    plain:
      title: "Идут ли продажи по ДДУ в этом месяце"
      how: "Месяцы продаж по ДДУ с деньгами на эскроу: от старта продаж до разрешения на ввод."
    unit: "0/1"
    dims: [p, t]
    expr: "flag_ddu[p,t] = 1{ sales_start[p] <= date[t] < rnv_date[p] }"
    terms:
      "flag_ddu[p,t]": "1 — в месяце t очередь p продаётся по ДДУ (эскроу), иначе 0"
      "sales_start[p]": "дата старта продаж очереди p (TIME.MILESTONES)"
      "rnv_date[p]": "дата РНВ очереди p (TIME.MILESTONES)"
      "date[t]": "последний день месяца t (F.TIME.DATE)"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "До РНВ продажи возможны только по ДДУ с эскроу (ст.15.4 214-ФЗ); старт — не раньше РНС (ст.51 ГрК) и публикации проектной декларации"
    rejected:
      - "Исходник: граница продаж по эскроу = «окончание ПФ» (CF1!D6), а не РНВ очереди; флаги AB8:AS8 перебиты нулями вручную"
    source_ids: [S_214_ART15_4, S_GRK_51, S_GRK_55]
    legacy: {cells: "CF1!F8:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_POST_RNV
    module: TIME
    name: "Флаг продаж по ДКП (после РНВ)"
    plain:
      title: "Идут ли продажи по ДКП в этом месяце"
      how: "Месяцы после разрешения на ввод. В них продажи идут по ДКП, и деньги приходят застройщику напрямую."
    unit: "0/1"
    dims: [p, t]
    expr: "flag_dkp[p,t] = 1{ date[t] >= rnv_date[p] }"
    terms:
      "flag_dkp[p,t]": "1 — в месяце t очередь p продаётся по ДКП (после РНВ), иначе 0"
      "rnv_date[p]": "дата РНВ очереди p (TIME.MILESTONES)"
      "date[t]": "последний день месяца t (F.TIME.DATE)"
    depends_on: [TIME.MILESTONES, F.TIME.DATE]
    rationale: "После РНВ нераспроданные помещения продаются по ДКП, деньги поступают застройщику напрямую"
    rejected: []
    source_ids: [S_GRK_55]
    legacy: {cells: "CF1!F9:AS9", verdict: fix}
    status: verified

  - id: F.TIME.FLAG_ESCROW_RELEASE
    module: TIME
    name: "Флаг месяца раскрытия эскроу очереди"
    plain:
      title: "Месяц раскрытия эскроу очереди"
      how: "Дата разрешения на ввод очереди плюс задержка раскрытия эскроу. В этот месяц застройщик получает деньги с эскроу и гасит проектный кредит."
    unit: "0/1"
    dims: [p, t]
    expr: |
      flag_release[p,t] = 1{ t == month_index(rnv_date[p]) + TIME.ESCROW_RELEASE_LAG_M }
      расчёт «как в исходном Excel»: flag_release[p,t] = 1{ t == month_index(TIME.LEGACY_ESCROW_RELEASE_DATE) } для всех очередей
    note: "Лаг по умолчанию 3 месяца (консервативно), 1 месяц — для чувствительности. Тот же месяц раскрытия определяет погашение проектного финансирования и конец начисления процентов (F.FIN.REPAYMENT через F.ESC.BALANCE), чтобы проценты не считались до другой даты, чем раскрытие. Расчёт «как в исходном Excel» повторяет исходник: одна дата раскрытия, проставленная руками (CF1!AB6)."
    terms:
      "flag_release[p,t]": "1 — в месяце t раскрывается эскроу очереди p, иначе 0"
      "month_index(x)": "номер месяца модели, в который попадает дата x"
      "rnv_date[p]": "дата РНВ очереди p (TIME.MILESTONES)"
    depends_on: [TIME.MILESTONES, TIME.ESCROW_RELEASE_LAG_M, F.TIME.DATE, TIME.LEGACY_ESCROW_RELEASE_DATE]
    rationale: "ч.6 ст.15.5 214-ФЗ — перечисление не позднее 10 рабочих дней после РНВ; раскрытие по каждой очереди отдельно"
    rejected:
      - "Раскрытие одной датой для всех очередей по «окончанию ПФ» (исходник) — завышает процентные расходы по ранним очередям"
    source_ids: [S_214_ART15_5]
    legacy: {cells: "CF1!F6:AS6", verdict: fix, issue: "AB6 = 1 проставлено руками"}
    status: verified

  # =====================================================================
  # TEP — площади
  # =====================================================================

  # Источник площадей зависит от GEN.PROJECT_STAGE (см. шапку раздела TEP в parameters.yaml):
  #   «оценка участка» — предельные параметры ГПЗУ/ПЗЗ + коэффициенты уровня 4/5;
  #   «концепция»      — ТЭП архитектора (уровень 4, вложение обязательно).

  - id: F.TEP.GFA_ABOVE
    module: TEP
    name: "ГНС наземной части в модели"
    plain:
      title: "Площадь наземной части (ГНС), м²"
      how: "На стадии «концепция» берётся из ТЭП архитектора. На стадии «оценка участка» — предел из ГПЗУ, а если его нет, пятно застройки × средняя этажность."
      example: "В проекте площадь наземной части — {=}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:
        gfa_above = TEP.GFA_ABOVE
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:
        ЕСЛИ GPZU.MAX_GFA_ABOVE задана:  gfa_above = GPZU.MAX_GFA_ABOVE
        ИНАЧЕ:                           gfa_above = TEP.FOOTPRINT_AREA × TEP.AVG_FLOORS
    note: "На стадии «концепция» берётся ГНС из ТЭП архитектора. На стадии «оценка участка» — предельная суммарная поэтажная площадь из ГПЗУ/ПЗЗ, а если она там не указана — пятно застройки × средняя этажность. Соответствие пределам ГПЗУ проверяет F.CHECK.GPZU_LIMITS (на стадии оценки — автоматически)."
    terms:
      "gfa_above": "результат: ГНС наземной части в модели, м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.GFA_ABOVE, GPZU.MAX_GFA_ABOVE, TEP.FOOTPRINT_AREA, TEP.AVG_FLOORS]
    rationale: "До концепции объём застройки ограничен предельными параметрами разрешённого строительства (ст.38 ГрК РФ): суммарная поэтажная площадь из ГПЗУ/ПЗЗ — прямой предел; если её нет — пятно застройки × средняя этажность, где пятно не больше участка × максимальный процент застройки. После концепции — ТЭП архитектора, который сверяется с пределами ГПЗУ"
    rejected:
      - "Ввод ГНС числом на стадии оценки без документа — не проверяется по ГПЗУ"
      - "Молча ограничивать пятно MIN(пятно, участок × % застройки) — скрывает ошибку ввода; вместо этого блокирующая ошибка F.CHECK.GPZU_LIMITS"
      - "Одна «СПП (ГНС)» без указания стадии и документа (исходник ТЭПы!C19)"
    source_ids: [S_GRK_38, S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C19", verdict: fix, issue: "вводилось числом без указания, из ГПЗУ или из концепции"}
    status: verified

  - id: F.TEP.GFA_SPLIT
    module: TEP
    name: "ГНС жилой, апартаментной и нежилой части в модели"
    plain:
      title: "Площадь жилой, апартаментной и нежилой частей, м²"
      how: "На стадии «концепция» берётся из документов. На стадии «оценка участка» наземная площадь делится по заданным долям жилья и апартаментов, остаток — нежилая часть."
      example: "Жилая часть {=.res|м2}, апартаменты {=.apart|м2}, нежилая часть {=.nonres|м2}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция» ИЛИ разделение задано в ГПЗУ/ППТ:
        res_gfa    = TEP.RES_GFA
        apart_gfa  = TEP.APART_GFA
        nonres_gfa = TEP.NONRES_GFA
      ИНАЧЕ (стадия «оценка участка»):
        res_gfa    = F.TEP.GFA_ABOVE × TEP.RES_GFA_SHARE
        apart_gfa  = F.TEP.GFA_ABOVE × TEP.APART_GFA_SHARE
        nonres_gfa = F.TEP.GFA_ABOVE × (1 − TEP.RES_GFA_SHARE − TEP.APART_GFA_SHARE)
    note: "На стадии «оценка участка» площади берутся из ГПЗУ/ППТ, если документ задаёт разделение (жилая, нежилая, при апартаментах — апартаментная часть); иначе считаются долями от ГНС наземной части. Ошибка, если TEP.RES_GFA_SHARE + TEP.APART_GFA_SHARE > 1. Апартаменты (apart_gfa > 0) допускаются, только если ГПЗУ допускает объекты гостиничного назначения — GPZU.APART_ALLOWED (проверка F.CHECK.ALL → APART_ALLOWED)."
    terms:
      "res_gfa": "результат: ГНС жилой части, м²"
      "apart_gfa": "результат: ГНС апартаментной части, м²"
      "nonres_gfa": "результат: ГНС нежилой части (коммерция, встроенные соцобъекты), м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.RES_GFA, TEP.APART_GFA, TEP.NONRES_GFA, F.TEP.GFA_ABOVE, TEP.RES_GFA_SHARE, TEP.APART_GFA_SHARE]
    rationale: "Жилая, апартаментная и нежилая части имеют разные коэффициенты продаваемой площади, разные продукты, цены и НДС. Разделение берётся из документа, а при его отсутствии — долями, чтобы части в сумме давали ГНС наземную"
    rejected:
      - "Одну часть из документа, а другую — долей: смешение документа и допущения, сумма может не совпасть с ГНС"
      - "Считать апартаменты частью жилой ГНС: апартаменты — нежилые помещения с другим ВРИ, НДС и ипотекой"
    source_ids: [S_GRK_38, S_PROJECT_DOCS, S_COMPANY_ACTUALS, S_ROSREESTR_P0412]
    legacy: {cells: "ТЭПы!C20:C21", verdict: keep}
    status: verified

  - id: F.TEP.APT_AREA
    module: TEP
    name: "Площадь квартир в модели (для продажи, по ДДУ)"
    plain:
      title: "Площадь квартир, м²"
      how: "На стадии «концепция» берётся из ТЭП архитектора. На стадии «оценка участка» — жилая часть × коэффициент полезной площади квартир."
      example: "В проекте площадь квартир — {=}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:       apt_area_total = TEP.APT_AREA
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:  apt_area_total = res_gfa × TEP.APT_EFFICIENCY
    terms:
      "apt_area_total": "результат: площадь квартир для продажи, м²"
      "res_gfa": "ГНС жилой части (F.TEP.GFA_SPLIT), м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.APT_AREA, F.TEP.GFA_SPLIT, TEP.APT_EFFICIENCY]
    rationale: "Площадь квартиры для продажи — площадь по ДДУ: общая площадь жилого помещения (ч.5 ст.15 ЖК РФ) плюс лоджии × 0,5, балконы × 0,3, террасы × 0,3, веранды × 1,0 (Приказ Минстроя № 854/пр); обмер — Приказ Росреестра № П/0393, приложение 2. До концепции площадь квартир получают из ГНС жилой части через коэффициент, подтверждённый фактом компании (уровень 4) или экспертом (уровень 5)"
    rejected:
      - "Ввод итоговой площади квартир на стадии оценки без коэффициента — непроверяемо"
      - "Обратный расчёт коэффициента из заданной площади (исходник ТЭПы!D22 = C22/C20)"
      - "Общая площадь по ЖК без лоджий/балконов — не совпадает с площадью в ДДУ, по которой считается выручка"
    source_ids: [S_ZHK_15, S_MINSTROY_854, S_ROSREESTR_P0393, S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C22, ТЭПы!D22", verdict: fix, issue: "площадь вбита числом, коэффициент получен обратным делением"}
    status: verified

  - id: F.TEP.COMM_AREA
    module: TEP
    name: "Площадь ПСН в модели"
    plain:
      title: "Площадь коммерческих помещений (ПСН), м²"
      how: "На стадии «концепция» берётся из ТЭП архитектора. На стадии «оценка участка» — нежилая часть × коэффициент полезной площади ПСН."
      example: "В проекте площадь ПСН — {=}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:       comm_area = TEP.COMM_AREA
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:  comm_area = nonres_gfa × TEP.COMM_EFFICIENCY
    terms:
      "comm_area": "результат: площадь коммерческих помещений (ПСН), м²"
      "nonres_gfa": "ГНС нежилой части (F.TEP.GFA_SPLIT), м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.COMM_AREA, F.TEP.GFA_SPLIT, TEP.COMM_EFFICIENCY]
    rationale: "Та же логика, что для квартир, со своим коэффициентом: у нежилой части иная доля продаваемой площади. Обмер — Приказ Росреестра № П/0393, приложение 2"
    rejected:
      - "Применять к нежилой части коэффициент квартир — разная планировочная эффективность"
      - "Коэффициент 0,8 без назначения (исходник ТЭПы!D23)"
    source_ids: [S_ROSREESTR_P0393, S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C23", verdict: keep}
    status: verified

  - id: F.TEP.APART_AREA
    module: TEP
    name: "Площадь апартаментов в модели"
    plain:
      title: "Площадь апартаментов, м²"
      how: "Считается, только если ГПЗУ допускает объекты гостиничного назначения, иначе ноль. Берётся из ТЭП архитектора или равна апартаментной части × коэффициент полезной площади."
      example: "В проекте площадь апартаментов — {=}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GPZU.APART_ALLOWED = нет:               apart_area = 0
      ИНАЧЕ ЕСЛИ GEN.PROJECT_STAGE = «концепция»:       apart_area = TEP.APART_AREA
      ИНАЧЕ ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:  apart_area = apart_gfa × TEP.APART_EFFICIENCY
    note: "Апартаменты возможны, только если ГПЗУ допускает объекты гостиничного назначения. Подсказка в интерфейсе: продукту соответствует ВРИ 4.7 «Гостиничное обслуживание» (LAND.VRI_CODES, П/0412)."
    terms:
      "apart_area": "результат: площадь апартаментов для продажи, м²"
      "apart_gfa": "ГНС апартаментной части (F.TEP.GFA_SPLIT), м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.APART_AREA, F.TEP.GFA_SPLIT, TEP.APART_EFFICIENCY, GPZU.APART_ALLOWED, LAND.VRI_CODES]
    rationale: "Апартаменты — нежилые помещения гостиничного назначения. Разрешение подтверждается ГПЗУ проекта (уровень 4, вложение): слово «апартаменты» в классификаторе ВРИ (П/0412) не используется, связь апартаментов с кодом 4.7 «Гостиничное обслуживание» — практика, поэтому код 4.7 — только подсказка, а решающий документ — ГПЗУ. Площадь — по той же логике, что квартиры, со своим коэффициентом; обмер — П/0393"
    rejected:
      - "Разрешать апартаменты без проверки ГПЗУ — продукт может оказаться недопустимым на участке"
      - "Решать по наличию кода 4.7 в ВРИ — классификатор не упоминает апартаменты, решающий документ — ГПЗУ"
      - "Применять к апартаментам коэффициент квартир — другая планировочная эффективность"
    source_ids: [S_PROJECT_DOCS, S_ROSREESTR_P0412, S_ROSREESTR_P0393, S_COMPANY_ACTUALS]
    legacy: {cells: null, verdict: new}
    status: verified

  - id: F.TEP.STORAGE
    module: TEP
    name: "Кладовые: количество и площадь в модели"
    plain:
      title: "Кладовые: количество, шт, и площадь, м²"
      how: "На стадии «концепция» берётся из ТЭП архитектора. На стадии «оценка участка» — число квартир × кладовых на квартиру, площадь — число кладовых × средняя площадь."
      example: "Кладовых {=.count|шт}, площадь {=.area|м2}."
    unit: шт
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:
        storage_count = TEP.STORAGE_COUNT
        storage_area  = TEP.STORAGE_AREA
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:
        storage_count = FLOOR( Σ_k F.TEP.APT_COUNT[k] × TEP.STORAGE_PER_APT )
        storage_area  = storage_count × TEP.STORAGE_AVG_AREA
    note: "Площадь кладовых входит в подземную часть (F.TEP.GFA_BELOW) и сверх неё не добавляется."
    terms:
      "storage_count": "результат: количество кладовых, шт"
      "storage_area": "результат: площадь кладовых, м²"
      "k": "тип квартир из квартирографии"
      "FLOOR(x)": "округление вниз до целого"
    depends_on: [GEN.PROJECT_STAGE, TEP.STORAGE_COUNT, TEP.STORAGE_AREA, F.TEP.APT_COUNT, TEP.STORAGE_PER_APT, TEP.STORAGE_AVG_AREA]
    rationale: "Кладовые продаются поштучно и размещаются в подземной части. До концепции количество определяется обеспеченностью на квартиру по концепциям компании (уровень 4), округление вниз — нельзя продать больше, чем построено"
    rejected:
      - "Добавлять площадь кладовых к ГНС сверх подземной части — двойной счёт"
      - "Фиксированное количество без привязки к числу квартир"
    source_ids: [S_COMPANY_ACTUALS, S_PROJECT_DOCS, S_ROSREESTR_P0393]
    legacy: {cells: "ТЭПы!E50", verdict: fix, issue: "«Прочие помещения» = 0"}
    status: verified

  - id: F.TEP.APT_COUNT
    module: TEP
    name: "Количество квартир по типу"
    plain:
      title: "Количество квартир по типам, шт"
      how: "На стадии «концепция» берётся из квартирографии. На стадии «оценка участка» площадь квартир делится между типами по долям и на среднюю площадь квартиры типа, с округлением вниз."
      example: "Всего квартир — {=|шт}."
    unit: шт
    dims: [k]
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:       count[k] = TEP.APT_MIX.count[k]
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:  count[k] = FLOOR( TEP.APT_MIX.area_share[k] × apt_area_total / TEP.APT_MIX.avg_area[k] )
    note: "На стадии «оценка участка» ошибка, если доли площади по типам в сумме не равны 1: |Σ_k area_share[k] − 1| > 1e-9."
    terms:
      "count[k]": "результат: количество квартир типа k, шт"
      "k": "тип квартир из квартирографии"
      "apt_area_total": "площадь квартир для продажи (F.TEP.APT_AREA), м²"
      "FLOOR(x)": "округление вниз до целого"
    depends_on: [GEN.PROJECT_STAGE, TEP.APT_MIX, F.TEP.APT_AREA]
    rationale: "Квартира — целое число. На стадии оценки квартирография задаётся долями площади и средней площадью типа, количество вычисляется; округление вниз гарантирует, что продаётся не больше площади, чем есть"
    rejected:
      - "ROUND — может дать площадь больше F.TEP.APT_AREA"
      - "Дробное количество (исходник: дробные лоты ПСН 136,1 × 80 м², План продаж!43)"
      - "Одновременный ввод количества и долей (исходник ТЭПы!C41:C43 и F41:F43) — расходятся"
    source_ids: [S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!F41:F43", verdict: keep}
    status: verified
    example: {input: {area_share: 0.25, apt_area_total: 143560, avg_area: 35.108}, output: 1022}

  - id: F.TEP.APT_TYPE_AREA
    module: TEP
    name: "Площадь квартир по типу"
    plain:
      title: "Площадь квартир по типам, м²"
      how: "Для каждого типа число квартир умножается на среднюю площадь квартиры."
      example: "Всего по типам — {=}."
    unit: м2
    dims: [k]
    expr: "apt_area[k] = F.TEP.APT_COUNT[k] × TEP.APT_MIX.avg_area[k]"
    terms:
      "apt_area[k]": "результат: площадь квартир типа k, м²"
      "k": "тип квартир из квартирографии"
    depends_on: [F.TEP.APT_COUNT, TEP.APT_MIX]
    rationale: "Количество и средняя площадь — первичные данные квартирографии; средняя площадь — по ДДУ, как F.TEP.APT_AREA"
    rejected: []
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E41:E43", verdict: keep}
    status: verified
    example: {input: {count: 961, avg_area: 35.108}, output: 33738.788}

  - id: F.TEP.APT_SHARE
    module: TEP
    name: "Доля типа квартир (по количеству)"
    plain:
      title: "Доля типа квартир по количеству"
      how: "Число квартир типа, делённое на общее число квартир."
    unit: доля
    dims: [k]
    expr: "apt_share[k] = F.TEP.APT_COUNT[k] / Σ_k F.TEP.APT_COUNT[k]"
    terms:
      "apt_share[k]": "результат: доля квартир типа k в общем количестве"
      "k": "тип квартир из квартирографии"
    depends_on: [F.TEP.APT_COUNT]
    rationale: "Доля вычисляется — нельзя получить противоречие между долей и количеством"
    rejected: ["Ручной ввод долей параллельно с количеством (ТЭПы!C41:C43)"]
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!C41:C43", verdict: replace}
    status: verified

  - id: F.TEP.APT_AREA_CHECK
    module: TEP
    name: "Сверка площади квартир: квартирография vs ТЭП"
    plain:
      title: "Сверка площади квартир: квартирография и ТЭП"
      how: "Сумма площадей квартир по квартирографии сравнивается с площадью квартир в ТЭП. Если расхождение больше допуска, появляется предупреждение."
      example: "Расхождение {=.diff_m2|м2}, это {=.check|доля} площади по ТЭП."
    unit: доля
    dims: []
    expr: |
      apt_diff_m2 = Σ_k apt_area[k] − apt_area_total
      apt_check   = apt_diff_m2 / apt_area_total
    note: "Предупреждение «расхождение {apt_diff_m2} м² ({apt_check})», если |apt_check| > TEP.APT_AREA_TOLERANCE."
    terms:
      "apt_diff_m2": "результат: расхождение квартирографии и ТЭП, м²"
      "apt_check": "результат: расхождение в долях от площади по ТЭП"
      "apt_area[k]": "площадь квартир типа k (F.TEP.APT_TYPE_AREA), м²"
      "apt_area_total": "площадь квартир по ТЭП (F.TEP.APT_AREA), м²"
    depends_on: [F.TEP.APT_TYPE_AREA, F.TEP.APT_AREA, TEP.APT_AREA_TOLERANCE]
    rationale: "На стадии концепции площадь квартир есть дважды — итог ТЭП и сумма квартирографии; на стадии оценки сумма меньше итога из-за округления количества вниз. Расхождение больше порога должно быть видно с разницей в м² и %"
    rejected: ["Молча брать одно из двух чисел (в исходнике ТЭПы!E44 и ТЭПы!C22 введены независимо)"]
    source_ids: [S_PROJECT_DOCS]
    legacy: {cells: "ТЭПы!E44 vs ТЭПы!C22", verdict: new}
    status: verified

  - id: F.TEP.PARKING_REQUIRED
    module: TEP
    name: "Требуемое количество машино-мест по нормативу региона"
    plain:
      title: "Сколько машино-мест требует норматив региона, шт"
      how: "Число квартир каждого типа умножается на норматив машино-мест региона, к этому добавляются места для апартаментов. Итог округляется вверх."
      example: "По нормативу нужно {=|шт}."
    unit: шт
    dims: []
    expr: |
      parking_required = CEILING( Σ_k F.TEP.APT_COUNT[k] × norm(TEP.APT_MIX.avg_area[k]) + parking_apart )
      ЕСЛИ TEP.PARKING_NORM_APART.unit = «на единицу»:         parking_apart = TEP.PARKING_NORM_APART.value × TEP.APART_COUNT
      ЕСЛИ TEP.PARKING_NORM_APART.unit = «на 100 м² площади»:  parking_apart = TEP.PARKING_NORM_APART.value × F.TEP.APART_AREA / 100
    note: "Нормативы машино-мест для квартир — из акта региона: Москва — ПП № 2118-ПП от 05.08.2026, СПб — ПП № 257 от 11.04.2017. Для апартаментов — норматив градостроительного проектирования для объектов гостиничного назначения: значение и единица («на единицу» или «на 100 м² площади») — из РНГП региона; пока значения региона нет — ручной ввод с документом (решение владельца продукта 27.09.2026). Расчёт «как в исходном Excel»: нормы по типам квартир из tests/cases/*_legacy.yaml (TEP.PARKING_NORM, rule = per_type); в расчёте сервиса запрещено."
    terms:
      "parking_required": "результат: требуемое количество машино-мест, шт"
      "norm(a)": "норматив машино-мест на квартиру средней площадью a — из TEP.PARKING_NORM региона"
      "parking_apart": "машино-места для апартаментов по нормативу TEP.PARKING_NORM_APART (значение и единица — из РНГП региона)"
      "k": "тип квартир из квартирографии"
      "CEILING(x)": "округление вверх до целого"
    depends_on: [F.TEP.APT_COUNT, TEP.APT_MIX, TEP.PARKING_NORM, TEP.PARKING_NORM_APART, TEP.APART_COUNT, F.TEP.APART_AREA]
    rationale: "Нормативы обеспеченности — обязательное требование РНГП; число мест определяет подземную часть и выручку"
    rejected: ["Вбитое число без документа (862 в исходнике при нормативе ≈ 2 785)"]
    source_ids: [S_MSK_PARKING_2118PP, S_SPB_NGP_257, S_SP_42_2026]
    legacy: {cells: "ТЭПы!J41:J44", verdict: fix, issue: "J44 перебит числом 862"}
    status: needs_verification
    example: {input: {counts: [961, 720, 720], norms: [0.8, 1.2, 1.6]}, output: 2785}

  - id: F.TEP.PARKING_COUNT
    module: TEP
    name: "Количество машино-мест в модели"
    plain:
      title: "Количество машино-мест, шт"
      how: "Большее из двух: сколько мест требует норматив и сколько задано в ГПЗУ. Ручное значение принимается только с документом."
      example: "В проекте {=|шт}, по нормативу требуется {F.TEP.PARKING_REQUIRED|шт}."
    unit: шт
    dims: []
    expr: |
      parking_calc = MAX( F.TEP.PARKING_REQUIRED, TEP.PARKING_GPZU_COUNT ?? 0 )
      parking      = TEP.PARKING_COUNT_OVERRIDE ?? parking_calc
    note: "Знак «??» означает: берётся левое значение, если оно заполнено, иначе правое. Ручное значение (TEP.PARKING_COUNT_OVERRIDE) — только с вложенным документом. Предупреждение «ниже норматива, основание — документ», если ручное значение меньше F.TEP.PARKING_REQUIRED."
    terms:
      "parking_calc": "расчётное количество машино-мест: большее из норматива и ГПЗУ/ППТ, шт"
      "parking": "результат: количество машино-мест в модели, шт"
    depends_on: [F.TEP.PARKING_REQUIRED, TEP.PARKING_GPZU_COUNT, TEP.PARKING_COUNT_OVERRIDE]
    rationale: "Число мест — норматив региона или больше, если так требуют ГПЗУ/ППТ. Отклонение, в том числе меньше норматива, допустимо только по документу (ГПЗУ, ППТ, СТУ, решение органа)"
    rejected:
      - "Вбитое число поверх норматива без документа (исходник ТЭПы!C27, J44 = 862)"
      - "Брать ГПЗУ/ППТ, даже если оно меньше норматива, — норматив обязателен; меньшее число — только по документу через override"
    source_ids: [S_PROJECT_DOCS, S_MSK_PARKING_2118PP, S_SPB_NGP_257]
    legacy: {cells: "ТЭПы!C27", verdict: fix}
    status: verified

  - id: F.TEP.PARKING_SPACE_MIN_AREA
    module: TEP
    name: "Минимальная площадь машино-места"
    plain:
      title: "Минимальная площадь машино-места, м²"
      how: "Минимальная длина машино-места × минимальная ширина по требованиям Росреестра."
      example: "{TEP.PARKING_SPACE_MIN_LENGTH} × {TEP.PARKING_SPACE_MIN_WIDTH} = {=}."
    unit: м2
    dims: []
    expr: "parking_space_min = TEP.PARKING_SPACE_MIN_LENGTH × TEP.PARKING_SPACE_MIN_WIDTH"
    terms:
      "parking_space_min": "результат: минимальная площадь машино-места, м²"
    depends_on: [TEP.PARKING_SPACE_MIN_LENGTH, TEP.PARKING_SPACE_MIN_WIDTH]
    rationale: "Нижняя граница площади на одно машино-место: само место не меньше 5,3 × 2,5 м (Приказ Росреестра № П/0316); с проездами площадь не может быть меньше. Максимальный размер с 28.10.2021 не ограничен — верхней границы нет"
    rejected: ["Задавать 13,25 м² отдельным числом — теряется связь с размерами из приказа"]
    source_ids: [S_ROSREESTR_P0316]
    legacy: {cells: null, verdict: new}
    status: verified
    example: {input: {length: 5.3, width: 2.5}, output: 13.25}

  - id: F.TEP.GFA_BELOW_EST
    module: TEP
    name: "Оценка подземной площади по числу машино-мест и кладовым"
    plain:
      title: "Оценка площади подземной части, м²"
      how: "Оценка до появления ТЭП: число машино-мест × площадь паркинга на одно место вместе с проездами, плюс площадь кладовых."
    unit: м2
    dims: []
    expr: "gfa_below_est = F.TEP.PARKING_COUNT × TEP.PARKING_AREA_PER_SPACE + storage_area"
    note: "Ошибка, если TEP.PARKING_AREA_PER_SPACE < F.TEP.PARKING_SPACE_MIN_AREA."
    terms:
      "gfa_below_est": "результат: оценка подземной площади, м²"
      "storage_area": "площадь кладовых (F.TEP.STORAGE), м²"
    depends_on: [F.TEP.PARKING_COUNT, TEP.PARKING_AREA_PER_SPACE, F.TEP.PARKING_SPACE_MIN_AREA, F.TEP.STORAGE]
    rationale: "Только стадия «Оценка участка»: подземной концепции ещё нет. Площадь на место с проездами — факт компании (уровень 4) или эксперт (уровень 5) с обоснованием и диапазоном; меньше минимальной площади самого места быть не может. Кладовые размещаются в подземной части и входят в её площадь"
    rejected: []
    source_ids: [S_COMPANY_ACTUALS, S_ROSREESTR_P0316]
    legacy: {cells: "ТЭПы!E49, ТЭПы!C34", verdict: keep}
    status: verified
    example: {input: {parking: 862, area_per_space: 40.945}, output: 35294.59}

  - id: F.TEP.GFA_BELOW
    module: TEP
    name: "Площадь подземной части в модели"
    plain:
      title: "Площадь подземной части, м²"
      how: "На стадии «концепция» берётся из ТЭП архитектора, на стадии «оценка участка» — оценка по машино-местам и кладовым."
      example: "В проекте площадь подземной части — {=}."
    unit: м2
    dims: []
    expr: |
      ЕСЛИ GEN.PROJECT_STAGE = «концепция»:       gfa_below = TEP.GFA_BELOW
      ЕСЛИ GEN.PROJECT_STAGE = «оценка участка»:  gfa_below = F.TEP.GFA_BELOW_EST
    terms:
      "gfa_below": "результат: площадь подземной части в модели, м²"
    depends_on: [GEN.PROJECT_STAGE, TEP.GFA_BELOW, F.TEP.GFA_BELOW_EST]
    rationale: "На стадии концепции подземная часть (паркинг, техпомещения) — из ТЭП архитектора; до неё — оценка через число машино-мест"
    rejected: ["Выводить подземную площадь из числа мест и после концепции (исходник ТЭПы!C34 = E49)"]
    source_ids: [S_PROJECT_DOCS, S_COMPANY_ACTUALS]
    legacy: {cells: "ТЭПы!C34", verdict: fix}
    status: verified

  - id: F.TEP.GFA_TOTAL
    module: TEP
    name: "ГНС общая"
    plain:
      title: "Общая площадь (ГНС), м²"
      how: "Площадь наземной части плюс площадь подземной части."
      example: "{F.TEP.GFA_ABOVE} + {F.TEP.GFA_BELOW} = {=}."
    unit: м2
    dims: []
    expr: "gfa_total = F.TEP.GFA_ABOVE + F.TEP.GFA_BELOW"
    terms:
      "gfa_total": "результат: ГНС общая (наземная + подземная), м²"
    depends_on: [F.TEP.GFA_ABOVE, F.TEP.GFA_BELOW]
    rationale: "Разделение на наземную и подземную части — у них разная стоимость СМР и разный охват НЦС"
