# Справочник допущений компании: стандартные значения, из которых создаётся новый проект без исходного Excel.
#
# Новый проект получает значения текущей (последней) версии и запоминает её номер. Финансист вводит только специфику
# объекта (ТЭП, цены, план продаж, смета, график СМР) и может заменить любое стандартное значение для своего проекта.
# Изменения справочника не пересчитывают существующие проекты: проект переходит на новую версию только по кнопке
# «Обновить» в самом проекте.
#
# Поля версии:
#   version  — номер версии (1, 2, …), по порядку
#   date     — дата публикации, ГГГГ-ММ-ДД
#   author   — кто опубликовал
#   note     — что изменилось в версии, простым языком
#   items    — все значения версии (полный список, а не разница с предыдущей)
#
# Поля значения:
#   param    — ID параметра из data/parameters.yaml
#   group    — раздел справочника: analysis | areas | sales | budget | escrow | fin (порядок и номера вопросов к данным — по порядку в списке)
#   value    — стандартное значение; null — стандарта нет, значение вводится в проекте
#   status   — unverified («не проверено») | check («проверить …», что именно — в поле check) | approved («утверждено»)
#   check    — для status: check — что проверить («условия банка»)
#   from     — «Откуда»: текст и необязательная ссылка (решение владельца продукта 27.09.2026)
#   note     — необязательное пояснение
#
# Первичное наполнение (версия 1) — значения из исходного Excel «Кальк Саевой привязка КОД.xlsx» с пометкой
# «не проверено» (решение владельца продукта 27.09.2026). После ответов финансистов по проекту «Дербеневская» значения
# переводятся в «утверждено» новой версией справочника.

versions:
  - version: 1
    date: "2026-09-27"
    author: "Первичное наполнение"
    note: "Значения из исходного Excel «Кальк Саевой привязка КОД.xlsx», не проверены. Резерв — 2% по методике Минстроя, лаг раскрытия эскроу — решение владельца продукта, надбавка к ключевой ставке — расчёт из Excel, проверить условия банка."
    items:
      # ---------- Продажи ----------
      - param: OPEX.MARKETING_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: маркетинг 3,5% выручки", url: null}
      - param: OPEX.BROKERAGE_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: брокеридж 3,5% выручки", url: null}
      - param: SALES.PAYMENT_MIX
        group: sales
        value:
          - {product: квартиры, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: ПСН, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: машино-места, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
        status: unverified
        from: {text: "Исходный Excel, лист «Эскроу»: ипотека 0,7 (кредит) и первоначальный взнос 0,2, оплата 100% — 0,1, рассрочки нет; одна структура для всех продуктов", url: null}
        note: "Для апартаментов и кладовых стандарта нет: в исходном Excel их не было"
      - param: SALES.MORTGAGE_BANK_FEE_RATE
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel комиссии банку по ипотеке нет", url: null}
        note: "Нужно значение из договора с банком-партнёром"
      - param: SALES.PRICE_STAGE_UPLIFT
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel цена растёт на 2% в квартал без деления на рост рынка и надбавки за готовность", url: null}
        note: "Надбавки по стадиям готовности не заданы"
      # ---------- Бюджет ----------
      - param: CAPEX.CONTINGENCY_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Методика Минстроя 421/пр: 2% для объектов непроизводственного назначения", url: "https://www.consultant.ru/document/cons_doc_LAW_362957/"}
        note: "Нижняя граница для оценки участка. В исходном Excel задумано 10% от расценок СМР (48 958 руб/м² × 153 882 м² = 7,53 млрд), но Бюджет!F42 складывает площадь со ставкой — 202 840 руб. Решение владельца продукта 27.09.2026: в расчёте сервиса 2%, на 10% не переходим"
      - param: OPEX.DEV_FEE_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: вознаграждение за управление проектом 2% выручки", url: null}
      # ---------- Эскроу ----------
      - param: TIME.ESCROW_RELEASE_LAG_M
        group: escrow
        value: 3
        status: approved
        from: {text: "Решение владельца продукта 27.09.2026: 3 месяца после ввода в эксплуатацию; закон — не позднее 10 рабочих дней после представления разрешения (ч.6 ст.15.5 214-ФЗ)", url: "https://www.consultant.ru/document/cons_doc_LAW_51038/7e20edcc51ba599c70fb328204e3ac1226e7d912/"}
      # ---------- Финансирование ----------
      - param: FIN.EQUITY_SHARE
        group: fin
        value: 0.1
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: собственные средства 10% бюджета", url: null}
      - param: FIN.RATE_PREFERENTIAL
        group: fin
        value: 0.05
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: льготная ставка 5% на часть долга, покрытую эскроу", url: null}
      - param: FIN.RATE_BASE_SPREAD
        group: fin
        value: 0.0575
        status: check
        check: "условия банка"
        from: {text: "Расчёт из исходного Excel, лист «CF1»: базовая ставка 20% − ключевая 14,25% = 5,75 п.п.", url: null}
        note: "В исходном Excel базовая ставка задана целиком, без привязки к ключевой"
      - param: FIN.RATE_DISCOUNT_COEF
        group: fin
        value: null
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: скидка к ставке −2 п.п. при избыточном покрытии эскроу", url: null}
        note: "Стандарта нет: скидка считается, только если она есть в договоре банка (решение владельца продукта 28.09.2026)"
      - param: FIN.RATE_MIN
        group: fin
        value: 0.001
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: минимальная ставка 0,1%", url: null}
      - param: FIN.ESCROW_RESERVE_RATE
        group: fin
        value: 0
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: остатки эскроу для ставки не уменьшаются", url: null}
      - param: FIN.FEE_ARRANGEMENT
        group: fin
        value: 0.01
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: комиссия за выдачу 1% лимита", url: null}
      - param: FIN.FEE_COMMITMENT
        group: fin
        value: null
        status: unverified
        from: {text: "В исходном Excel комиссии за неиспользованный лимит нет", url: null}
        note: "Нужно значение из кредитного решения банка"
      - param: FIN.COLLATERAL_DISCOUNT
        group: fin
        value: 0.15
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: дисконт залоговой стоимости 15%", url: null}
  - version: 2
    date: "2026-09-29"
    author: "Первичное наполнение"
    note: "Новые разделы для анализа участка: «Оценка участка» (критерий выбора варианта, пороги, ставка дисконтирования, сроки), «Коэффициенты выхода площадей», ставки бюджета для вариантов освоения, рыночный рост цен. Значения из исходного Excel не проверены; пороги и ставка дисконтирования не заданы."
    items:
      # ---------- Оценка участка ----------
      - param: VAL.SELECT_CRITERION
        group: analysis
        value: NPV
        status: unverified
        from: {text: "Задание, раздел 4.G: максимальный NPV, пока руководитель не утвердил критерий; решение пользователя 29.09.2026 оставить NPV", url: null}
      - param: VAL.HURDLE_IRR
        group: analysis
        value: null
        status: unverified
        from: {text: "Инвестиционная политика компании — порог не утверждён", url: null}
        note: "Пока не задан, условие «IRR не ниже порога» не проверяется"
      - param: VAL.MAX_PEAK_DEBT
        group: analysis
        value: null
        status: unverified
        from: {text: "Лимит компании на долг проекта — не утверждён", url: null}
        note: "Пока не задан, условие «пиковый долг не выше лимита» не проверяется"
      - param: VAL.MAX_SALES_M
        group: analysis
        value: null
        status: unverified
        from: {text: "Предел срока продаж — не утверждён", url: null}
        note: "Пока не задан, условие «срок продаж не больше предела» не проверяется"
      - param: VAL.RISK_FREE
        group: analysis
        value: null
        status: unverified
        from: {text: "Доходность ОФЗ со сроком, близким к сроку проекта, на дату оценки — кривая бескупонной доходности Банка России", url: "https://www.cbr.ru/hd_base/zcyc_params/"}
        note: "Нужно для NPV: введите доходность и дату, на которую она взята"
      - param: VAL.EQUITY_PREMIUM
        group: analysis
        value: null
        status: unverified
        from: {text: "Премия за риск девелоперского проекта — Экспертное значение компании", url: null}
        note: "Нужно для NPV: ставка дисконтирования = безрисковая ставка + премия"
      - param: VAR.LOWER_LEVELS
        group: analysis
        value: 2
        status: unverified
        from: {text: "Задание, раздел 4.E: максимум этажности по регламенту и 1–2 уровня ниже", url: null}
      - param: VAR.MAX_VARIANTS
        group: analysis
        value: 6
        status: unverified
        from: {text: "Задание, раздел 4.E: система строит 4–6 вариантов", url: null}
      - param: TIME.PRE_RNS_M
        group: analysis
        value: 0
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: покупка участка и РНС в 4 кв 2025 (C6, C7)", url: null}
        note: "Для нового участка обычно нужен срок на ГПЗУ, проект и экспертизу — уточните"
      - param: TIME.CONSTRUCTION_M
        group: analysis
        value: 45
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: РНС 31.12.2025 → ввод очереди 1 30.09.2029 (C7, C10) = 45 мес", url: null}
        note: "Одинаков для всех очередей и этажности"
      - param: TIME.SALES_AFTER_RNS_M
        group: analysis
        value: 3
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: РНС 4 кв 2025 → старт продаж 1 кв 2026 (C7, C8) = 3 мес", url: null}
      # ---------- Коэффициенты выхода площадей ----------
      - param: TEP.RES_GFA_SHARE
        group: areas
        value: 0.9481
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: ГНС жилая 210 458 м² / ГНС наземная 221 967 м² (C20, C18)", url: null}
        note: "Остальное — нежилая часть (ПСН). В исходнике жилая и нежилая вместе больше наземной на 7 500 м² — расхождение исходника"
      - param: TEP.APT_EFFICIENCY
        group: areas
        value: 0.6821
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: площадь квартир 143 560 м² / ГНС жилая 210 458 м²", url: null}
      - param: TEP.COMM_EFFICIENCY
        group: areas
        value: 0.543
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: площадь ПСН 10 322 м² / ГНС нежилая 19 009 м²", url: null}
      - param: TEP.APART_EFFICIENCY
        group: areas
        value: null
        status: unverified
        from: {text: "В исходном Excel апартаментов нет", url: null}
        note: "Пока не задан, варианты с апартаментами не строятся"
      - param: TEP.APT_MIX
        group: areas
        value:
          - {type_name: "Тип 1", area_share: 0.235, avg_area: 35.108}
          - {type_name: "Тип 2", area_share: 0.3036, avg_area: 60.53}
          - {type_name: "Тип 3", area_share: 0.4614, avg_area: 92}
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: 961 × 35,108 м², 720 × 60,53 м², 720 × 92 м² — доли в площади квартир (D41:F43)", url: null}
        note: "Квартирография проекта бизнес-класса; для других классов уточните"
      - param: TEP.STORAGE_PER_APT
        group: areas
        value: 0
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы», строка 50: прочие помещения (кладовые) = 0", url: null}
      - param: TEP.PARKING_AREA_PER_SPACE
        group: areas
        value: 40.945
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: площадь паркинга на машино-место с проездами 40,945 м²", url: null}
      - param: TEP.LANDSCAPE_SHARE
        group: areas
        value: 0.3
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: благоустройство 30% площади участка", url: null}
      - param: TEP.ROAD_SHARE
        group: areas
        value: 0.1
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: проезды 10% благоустройства", url: null}
      - param: TEP.GREEN_SHARE
        group: areas
        value: 0.1
        status: unverified
        from: {text: "Исходный Excel, лист «ТЭПы»: озеленение 10% благоустройства", url: null}
      # ---------- Продажи (рост цен) ----------
      - param: SALES.PRICE_MARKET_GROWTH
        group: sales
        value: {by_year: {2026: 0.056, 2027: 0.04, 2028: 0.04, 2029: 0.04}, after_last: last}
        status: unverified
        from: {text: "Прогноз инфляции Минэкономразвития (сценарные условия от 21.05.2026, базовый вариант): цены растут вместе с инфляцией, пока нет данных о росте цен в локации", url: "https://www.garant.ru/products/ipo/prime/doc/414115625/"}
        note: "Для анализа нового участка (решение владельца продукта 29.09.2026); у проекта из Excel остаётся своё значение"
      # ---------- Бюджет (ставки для вариантов) ----------
      - param: CAPEX.ESTIMATE_RATES
        group: budget
        value:
          - {item: "Предпроектные проработки (концепция)", housing_class: все, per: "сумма на проект", rate: 2000000, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "Проектирование, стадия П", housing_class: все, per: "м² общей ГНС", rate: 2919.75, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "Подготовка площадки (включая снос)", housing_class: все, per: "м² участка", rate: 1465.79, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "СМР надземной части (в т.ч. стилобат)", housing_class: бизнес, per: "м² наземной ГНС", rate: 237794.88, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "ТУ и плата за технологическое присоединение", housing_class: все, per: "м² общей ГНС", rate: 4461.08, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "Наружные сети и сооружения", housing_class: все, per: "м² общей ГНС", rate: 4461.08, price_date: "2025-12-31", vat: "с НДС"}
          - {item: "Благоустройство", housing_class: все, per: "м² благоустройства", rate: 46.8, price_date: "2025-12-31", vat: "с НДС"}
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: суммы статей Дербеневской, делённые на базу статьи (ГНС общая 257 261,59 м², наземная 221 967 м², участок 96 572 м², благоустройство 28 971,6 м²); цены на 31.12.2025 с НДС", url: null}
        note: "СМР — только для бизнес-класса: для комфорта и премиума ставки нет. Подземная часть, соцобъекты, УДС и мониторинг в исходнике не посчитаны или привязаны к участку — в вариантах не учтены"
      # ---------- Продажи ----------
      - param: OPEX.MARKETING_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: маркетинг 3,5% выручки", url: null}
      - param: OPEX.BROKERAGE_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: брокеридж 3,5% выручки", url: null}
      - param: SALES.PAYMENT_MIX
        group: sales
        value:
          - {product: квартиры, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: ПСН, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: машино-места, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
        status: unverified
        from: {text: "Исходный Excel, лист «Эскроу»: ипотека 0,7 (кредит) и первоначальный взнос 0,2, оплата 100% — 0,1, рассрочки нет; одна структура для всех продуктов", url: null}
        note: "Для апартаментов и кладовых стандарта нет: в исходном Excel их не было"
      - param: SALES.MORTGAGE_BANK_FEE_RATE
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel комиссии банку по ипотеке нет", url: null}
        note: "Нужно значение из договора с банком-партнёром"
      - param: SALES.PRICE_STAGE_UPLIFT
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel цена растёт на 2% в квартал без деления на рост рынка и надбавки за готовность", url: null}
        note: "Надбавки по стадиям готовности не заданы"
      # ---------- Бюджет ----------
      - param: CAPEX.CONTINGENCY_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Методика Минстроя 421/пр: 2% для объектов непроизводственного назначения", url: "https://www.consultant.ru/document/cons_doc_LAW_362957/"}
        note: "Нижняя граница для оценки участка. В исходном Excel задумано 10% от расценок СМР (48 958 руб/м² × 153 882 м² = 7,53 млрд), но Бюджет!F42 складывает площадь со ставкой — 202 840 руб. Решение владельца продукта 27.09.2026: в расчёте сервиса 2%, на 10% не переходим"
      - param: OPEX.DEV_FEE_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: вознаграждение за управление проектом 2% выручки", url: null}
      # ---------- Эскроу ----------
      - param: TIME.ESCROW_RELEASE_LAG_M
        group: escrow
        value: 3
        status: approved
