    land_tax_source_ids: [S_MSK_LANDTAX_74, S_FNS_RATES]
    land_tax_rate_housing:
      value: 0.001
      source_ids: [S_MSK_LANDTAX_74, S_MSK_LAW_34_2023, S_MSK_LAW_27_2025, S_NK_394]
      status: needs_verification
      note: "Закон Москвы № 74, п.2 ч.1 ст.2: 0,1% для участков, предоставленных для жилищного строительства; исключения для участков дороже 300 млн руб. нет (законы № 34 от 22.11.2023 и № 27 от 25.06.2025 его не вводили). Подтвердить у налогового консультанта: в законе Москвы — «предоставленных», а не «приобретённых (предоставленных)», как в ст.394 НК РФ"
    land_rent_source_ids: [S_MSK_RENT_273PP]
    # Аренда участка для строительства жилого здания, гостиницы (273-ПП, п. 3.1, 3.2.1–3.2.9; ставки — доли кадастровой
    # стоимости за год срока аренды). Применяется, если в проекте нет суммы по договору аренды (LAND.RENT_ANNUAL).
    land_rent:
      source_ids: [S_MSK_RENT_273PP, S_MSK_2886PP, S_MSK_DGI_K1]
      lease_years: 6  # п. 3.1: срок аренды для строительства жилого здания, гостиницы
      year_rates:
        - {year: 1, rate: 0.015, plus_first_year: true}  # п. 3.2.1: прил. 1 п. 1.1 «строительство жилых зданий» + прил. 8; платится разом (п. 3.2.2)
        - {year: 2, rate: 0.015}  # п. 3.2.3: прил. 1
        - {year: 3, rate: 0.03}   # п. 3.2.4: двойная ставка прил. 1
        - {year: 4, rate: 0.05}   # п. 3.2.5
        - {year: 5, rate: 0.07}   # п. 3.2.6
        - {year: 6, rate: 0.08}   # п. 3.2.9, абзац второй
      after_term_rate: 0.10           # п. 3.2.9: после срока аренды до ввода объекта
      after_commissioning_rate: 0.001 # п. 3.2.3: с ввода — прил. 1 п. 1 «дома многоэтажной жилой застройки»
      first_year:
        # Приложение 8: СТАВКА = Σ Pi × Si / (КСЗУ × 1,001) × k × k1 × k2 × 100%; сумма = СТАВКА × КСЗУ
        quarters_file: msk_rent_273pp_quarters.csv
        divisor: 1.001
        k1: 1.9775  # приказ ДГИ от 29.10.2026 № 441
        k2: 1       # «коэффициент доходности равняется 1»; иначе — только при КС в размере рыночной
      status: needs_verification
      note: "Si: жилая часть — по Pi «жильё», апартаменты — по Pi «временное проживание»; встроенная нежилая часть иного назначения и подземная часть не учитываются (п. 3.2.1 в ред. 2886-ПП: «включая нежилую часть жилого здания, без учёта нежилой площади помещений иного нежилого функционального назначения») — уточнить у ДГИ. Ставка после ввода (0,1%) — по строке прил. 1 для эксплуатации жилья — уточнить. Не учтены: рассрочка первого года (п. 3.6), снижение k на 15% по 305-ПП (п. 3.5(1)), отсрочка по 2821-ПП. k1 меняется раз в квартал"
    # Оценка кадастровой стоимости, если её нет в проекте (решение пользователя 17.11.2026: у проектов только адрес и площадь):
