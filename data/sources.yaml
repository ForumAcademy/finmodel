# Реестр источников. Единственное место, где хранятся ссылки.
# Параметры и формулы ссылаются на источники только по id.
#
# level — уровень доверия (docs/00_principles.md):
#   1 — закон / нормативный правовой акт / официальное разъяснение органа власти
#   2 — официальная статистика и данные госорганов (ЦБ, Росстат, Минстрой, МЭР, ЕИСЖС, ФНС-сервисы)
#   3 — рыночные данные и аналитика (банки, ДОМ.РФ-аналитика, консультанты) с выборкой аналогов
#   4 — внутренние данные компании (договоры, сметы, факт прошлых проектов)
#   5 — экспертная оценка (обязательны автор, обоснование, диапазон)
#
# scope — global  : общий источник справочника (законы, НПА, статистика, госсервисы, рыночные данные, бенчмарки компании);
#                    уровни 1–4, для уровней 1–3 обязателен URL.
#         project : ТИП проектного источника (ГПЗУ, ППТ, ТЭП архитектора, договор, term sheet, экспертная оценка).
#                    Конкретный документ хранится внутри проекта (вложение, автор, дата) и в справочник не попадает;
#                    уровни 4–5, URL не задаётся (docs/00_principles.md, раздел 6).
#
# accessed — дата, когда ссылка проверена. verified: true — содержание сверено с формулировкой в spec.
# Ссылки на КонсультантПлюс/Гарант ведут на актуальную редакцию статьи.

sources:

