name: Проверка источников

# Доступность открытых источников с сервера в России (Хостленд) и с зарубежного
# сервера GitHub. Только чтение; на сервере ничего не устанавливает и не меняет.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_sources.py
      - .github/workflows/probe-sources.yml

permissions:
  contents: read

jobs:
  abroad:
    name: С зарубежного сервера (GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверка
        run: python3 scripts/probe_sources.py --label github | tee out.txt
      - name: Итог
        run: grep -v '^JSON:' out.txt >> "$GITHUB_STEP_SUMMARY"

  russia:
    name: С сервера в России (Хостленд)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверка через SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          set -o pipefail
          # Ключ, скопированный из консоли Windows, может прийти с \r, пробелами
          # или склеенным в одну строку: собираем его заново из base64-части.
          install -m 600 /dev/null key
          python3 -c 'import os,re,textwrap; k=os.environ["SSH_KEY"]; m=re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END", k, re.S); b=re.sub(r"\s+", "", m.group(2)); print(f"-----BEGIN {m.group(1)}-----"); print("\n".join(textwrap.wrap(b, 70))); print(f"-----END {m.group(1)}-----")' > key
          ssh-keygen -y -f key > /dev/null && echo "ключ прочитан"
          ssh -i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$USER_NAME@$HOST" 'python3 - --label server' < scripts/probe_sources.py | tee out.txt
          rm -f key
      - name: Итог
        run: grep -v '^JSON:' out.txt >> "$GITHUB_STEP_SUMMARY"
