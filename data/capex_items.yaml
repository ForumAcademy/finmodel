# Справочник статей бюджета (значения по умолчанию для шаблона).
# Сумма статьи всегда считается F.CAPEX.ITEM_AMOUNT = rate × base_qty × index (× (1+НДС), если ставка без НДС и НДС не вычитается).
# Ручной ввод суммы запрещён — только ставки. Для фиксированных сумм base = фикс, base_qty = 1.
# vat_rate — ставка НДС статьи: TAX.VAT_RATE (0,22) или значение из TAX.VAT_RATE_OPTIONS (0 / 0,05 / 0,07 / 0,22; 5% и 7% — подрядчик на УСН);
#   vat_rules — условные ставки (первое правило, у которого выполнены все условия when); vat_taxable_share — облагаемая доля смешанной статьи.
# index_type — индекс пересчёта цен: investment — дефлятор инвестиций (CAPEX.COST_INDEX), cpi — ИПЦ (CAPEX.OPEX_INDEX), none — не индексируется.
#   Статьи с базой «доля от другой суммы» (от выручки или от СМР) — всегда none: база уже в ценах своего месяца, иначе двойной счёт.
# Решения владельца продукта 27.09.2026.
#
# legacy.budget_row — строка листа «Бюджет » исходника; legacy.cf_rows — строки суммы/распределения на листе «CF1 ».
# legacy.amount — сумма, вбитая в исходнике (сохраняется в tests/cases/derbenevskaya_legacy.yaml для сверки).

