      - param: VAL.RISK_FREE
        group: analysis
        value: null
        status: unverified
        from: {text: "Кривая бескупонной доходности ОФЗ Мосбиржи на дату оценки в точке срока проекта — сервис загружает её в проекте сам", url: "https://www.moex.com/ru/marketdata/indices/state/g-curve/"}
