  # TEP — технико-экономические показатели
  # =====================================================================

  # Правила определения площадей (универсальная методика, решение владельца продукта 25.09.2026):
  #   • Источник площадей зависит от стадии проекта GEN.PROJECT_STAGE:
  #       «оценка участка» — из предельных параметров ГПЗУ/ПЗЗ (ст.38 ГрК РФ) и коэффициентов (уровень 4/5);
  #       «концепция»      — из ТЭП архитектора (уровень 4, вложение документа обязательно).
  #   • Параметры TEP.GFA_ABOVE, TEP.GFA_BELOW, TEP.RES_GFA, TEP.NONRES_GFA, TEP.APT_AREA, TEP.COMM_AREA — это
  #     значения из документов; значения, которые использует модель, — формулы F.TEP.* с тем же смыслом.
  #   • Продаваемая площадь итоговым числом не вводится: F.TEP.SALEABLE_AREA = сумма по продуктам.

