# Сборщик данных finmodel: отдельный файл для поддомена, другие сайты не затрагивает.
# Место на сервере: /etc/nginx/sites-available/finmodel (+ ссылка в sites-enabled).
# HTTPS добавит certbot командой: certbot --nginx -d finmodel.orientirgpz.com
limit_req_zone $binary_remote_addr zone=finmodel_req:1m rate=5r/s;

server {
    listen 80;
    server_name finmodel.orientirgpz.com;

    client_max_body_size 1m;

    location / {
        limit_req zone=finmodel_req burst=10 nodelay;
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
