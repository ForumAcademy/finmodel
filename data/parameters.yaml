  - id: CAPEX.ITEMS
    name: "Справочник статей бюджета"
    unit: table
    kind: table
    columns:
      - {key: item_id, unit: текст}
      - {key: group, unit: enum, options: [правообладание, ПИР, СМР, сети, благоустройство, соцобъекты, управление, коммерческие]}
      - {key: base, unit: enum, options: [LAND.AREA, TEP.GFA_ABOVE, TEP.GFA_BELOW, TEP.MOP_AREA, F.TEP.GFA_TOTAL, F.TEP.SALEABLE_AREA, F.TEP.LANDSCAPE_AREA, F.CAPEX.SMR_TOTAL, F.SALES.REVENUE_TOTAL, LAND.PURCHASE_PRICE, фикс, фикс_в_месяц, формула]}
      - {key: rate, unit: "руб/ед. базы или доля", note: "если не задана — значение параметра rate_param статьи (capex_items.yaml)"}
      - {key: price_date, unit: дата, note: "дата уровня цен ставки — для индексации; обязательна, если статья индексируется"}
      - {key: vat_included, unit: bool, note: "ставка с НДС или без"}
      - {key: vat_rate, unit: доля, note: "ставка НДС по договору (TAX.VAT_RATE_OPTIONS: 0,05 / 0,07 — подрядчик на УСН); если не задана — по capex_items.yaml"}
      - {key: schedule_rule, unit: enum, options: [uniform, s_curve, at_milestone, follow_smr, follow_sales, manual]}
      - {key: schedule_from, unit: веха}
      - {key: schedule_to, unit: веха}
      - {key: schedule_manual, unit: ряд, note: "ручной график (schedule_rule = manual): from — дата первого периода, step — month | quarter, weights — доли периодов; доля квартала делится поровну на три месяца"}
      - {key: source_ids, unit: список}
      - {key: basis, unit: текст}
    scope: project
    default: "см. data/capex_items.yaml — перечень статей с нормативными источниками по умолчанию"
    source_ids: [S_NCS_2026_01, S_MINSTROY_421, S_COMPANY_ACTUALS]
    basis: "В исходнике суммы вбиты числом, а «расценка» получалась обратным делением (Бюджет!D = F/E). Теперь сумма всегда = ставка × база × индекс"
    status: project_input
    legacy: [{cell: "Бюджет!D17:F49", verdict: fix, note: "детально — capex_items.yaml → legacy"}]

