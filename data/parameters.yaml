# Реестр исходных параметров модели.
# Правило: любое число, которое не вычисляется формулой из formulas.yaml, обязано быть здесь.
# В коде расчётного ядра «магических чисел» нет — только ссылки на id отсюда.
#
# Поля:
#   id            — уникальный идентификатор МОДУЛЬ.ИМЯ (используется в формулах)
#   name          — название для интерфейса
#   unit          — единица: руб | руб/м2 | руб/шт | м2 | шт | доля | %годовых | дата | мес | enum | текст | коэф
#                   Доли хранятся как доли (0.22), а не проценты (22). Деньги — в рублях без НДС, если не указано иное.
#   kind          — scalar | series (по месяцам) | table | enum | date | bool | text
#   scope         — template (универсальное значение из закона/статистики, одинаково для всех проектов)
#                   region  (зависит от субъекта/муниципалитета — берётся из regions.yaml)
#                   project (вводится по проекту; без значения по умолчанию)
#   default       — значение по умолчанию (для scope=template/region) или null
#   range         — [min, max] допустимый диапазон; выход — предупреждение валидатора
#   source_ids    — ссылки на data/sources.yaml (обязательно ≥1)
#   basis         — почему значение такое / откуда оно берётся (обязательно)
#   how_to_fill   — инструкция пользователю, где взять значение
#   status        — verified | needs_verification | project_input | expert_allowed
#   legacy        — ячейки исходного Excel, откуда пришло значение, и вердикт (keep | fix | replace | remove)
#
# Значения конкретного проекта (Дербеневская) — в tests/cases/derbenevskaya_legacy.yaml.

parameters:

  # =====================================================================
  # GEN — общие параметры
  # =====================================================================

  - id: GEN.PROJECT_NAME
    name: "Название проекта"
    unit: текст
    kind: text
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "Идентификация расчёта"
    status: project_input
    legacy: [{cell: "ТЭПы!C2", verdict: keep}]

  - id: GEN.REGION_CODE
    name: "Субъект РФ (код ФНС)"
    unit: enum
    kind: enum
    scope: project
    default: null
    source_ids: [S_FNS_RATES]
    basis: "Определяет все региональные параметры (regions.yaml): ставки земельного налога, аренда, ВРИ, нормативы парковок, коэффициент перехода НЦС"
    how_to_fill: "Выбрать из списка regions.yaml"
    status: project_input
    legacy: [{cell: null, verdict: "new — в исходном файле регион не задан, нормативы Москвы зашиты неявно"}]

  - id: GEN.OKTMO
    name: "ОКТМО муниципального образования"
    unit: текст
    kind: text
    scope: project
    default: null
    source_ids: [S_FNS_RATES, S_NSPD]
    basis: "Ставка земельного налога устанавливается муниципалитетом (п.1 ст.394 НК РФ), поиск в сервисе ФНС — по ОКТМО"
    how_to_fill: "Взять из выписки ЕГРН / НСПД по кадастровому номеру"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: GEN.CADASTRAL_NUMBER
    name: "Кадастровый номер участка"
    unit: текст
    kind: text
    scope: project
    default: null
    source_ids: [S_NSPD]
    basis: "Ключ для проверки площади, ВРИ и кадастровой стоимости по официальным данным Росреестра"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: GEN.HOUSING_CLASS
    name: "Класс жилья"
    unit: enum
    kind: enum
    options: [эконом, комфорт, бизнес, премиум]
    scope: project
    default: null
    source_ids: [S_EISZHS_INDICATORS]
    basis: "Определяет выбор аналогов для цены/темпа и уровень отделки МОП. Классификация по данным ЕИСЖС; список классов в форме «Новый проект» — эконом, комфорт, бизнес, премиум (решение владельца продукта 28.09.2026)"
    status: project_input
    legacy: [{cell: "ТЭПы!C4", value: "БИЗНЕС", verdict: keep}]

  - id: GEN.PROJECT_STAGE
    name: "Что есть по проекту"
    unit: enum
    kind: enum
    options: [оценка участка, концепция]
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "Определяет, откуда берутся площади (раздел TEP). «Оценка участка» — концепции нет: ГНС из предельных параметров ГПЗУ/ПЗЗ (ст.38 ГрК РФ), площади продуктов — через коэффициенты уровня 4/5. «Концепция» (и все последующие стадии) — площади из ТЭП архитектора с вложением документа"
    how_to_fill: "«Есть концепция архитектора — площади по его ТЭП», если есть ТЭП архитектора; иначе «есть только участок — площади по плотности»"
    status: project_input
    legacy: [{cell: null, verdict: "new — в исходнике стадия не задана; площади взяты из ТЭП (соответствует «концепции»)"}]

  - id: GEN.MODEL_START_DATE
    name: "Дата начала модели (первый месяц)"
    unit: дата
    kind: date
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "Начало временной шкалы. Все ряды — помесячно от этой даты"
    status: project_input
    legacy: [{cell: "CF1!E2", value: "2025-12-31", verdict: keep, note: "в исходнике шаг — квартал; в новой модели — месяц"}]

  - id: GEN.VALUATION_DATE
    name: "Дата оценки (приведения NPV)"
    unit: дата
    kind: date
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "Дата, на которую дисконтируются потоки. В исходнике отсутствовала — NPV фактически не считался (Бюджет!F63 = финрез)"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: GEN.REPORT_STEP
    name: "Шаг отчётов"
    unit: enum
    kind: enum
    options: [месяц, квартал, год]
    scope: project
    default: квартал
    source_ids: [S_EXPERT]
    basis: "Расчёт всегда помесячный (точность эскроу и процентов), отчёты агрегируются. Выбор пользователя"
    from:
      text: "Расчёт всегда помесячный (точность эскроу и процентов), отчёты агрегируются. Выбор пользователя"
      url: null
    status: verified
    legacy: [{cell: null, verdict: new}]

  - id: GEN.PHASES_COUNT
    name: "Количество очередей"
    unit: шт
    kind: scalar
    scope: project
    default: 1
    range: [1, 20]
    source_ids: [S_PROJECT_DOCS]
    basis: "По ППТ / концепции. Каждая очередь имеет свои вехи (РНС, РНВ) и свой счёт эскроу"
    status: project_input
    legacy: [{cell: "ТЭПы!C17", value: 3, verdict: fix, note: "в исходнике 3 очереди объявлены, но расчёт ведётся одной суммой на одной шкале"}]

  # =====================================================================
  # LAND — участок и права
  # =====================================================================

  - id: LAND.AREA
    name: "Площадь земельного участка"
    unit: м2
    kind: scalar
    scope: project
    default: null
    range: [100, 5000000]
    source_ids: [S_NSPD, S_PROJECT_DOCS]
    basis: "Площадь по ЕГРН"
    how_to_fill: "Выписка ЕГРН или НСПД по кадастровому номеру"
    status: project_input
    legacy: [{cell: "ТЭПы!C15", value: 96572, verdict: keep}, {cell: "ТЭПы!I15", value: 96572, verdict: remove, note: "дубль"}]

  - id: LAND.VRI_CODES
    name: "Виды разрешённого использования участка (коды классификатора)"
    unit: текст
    kind: table
    scope: project
    default: null
    source_ids: [S_ROSREESTR_P0412, S_NSPD, S_PROJECT_DOCS]
    basis: "Коды ВРИ по классификатору (Приказ Росреестра от 10.11.2020 № П/0412) из ЕГРН/ГПЗУ. Справочная информация и подсказка: код 4.7 «Гостиничное обслуживание» означает, что ГПЗУ допускает апартаменты. Решающее условие для апартаментов — GPZU.APART_ALLOWED по ГПЗУ проекта"
    how_to_fill: "Выписка ЕГРН / НСПД / ГПЗУ по кадастровому номеру; приложить документ"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: LAND.CADASTRAL_VALUE
    name: "Кадастровая стоимость участка (текущая)"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_NSPD]
    basis: "База для земельного налога (ст.390 НК РФ) и аренды. В исходнике не указано — до или после смены ВРИ (комментарий ТЭПы!D13)"
    how_to_fill: "НСПД / выписка ЕГРН о кадастровой стоимости на 1 января года"
    status: project_input
    legacy: [{cell: "ТЭПы!C13", value: 5834907660, verdict: keep}, {cell: "ТЭПы!I13", value: 5834907660, verdict: remove, note: "дубль"}]

  - id: LAND.CADASTRAL_VALUE_AFTER_VRI
    name: "Кадастровая стоимость после изменения ВРИ"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_NSPD, S_MSK_VRI_593PP]
    basis: "Нужна для платы за изменение ВРИ (от прироста кадастровой стоимости) и налога после смены ВРИ"
    how_to_fill: "Оценка по удельному показателю кадастровой стоимости для нового ВРИ в квартале (НСПД) или расчёт ДГИ"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: LAND.TENURE
    name: "Форма права на участок"
    unit: enum
    kind: enum
    options: [собственность, аренда]
    scope: project
    default: собственность
    source_ids: [S_NK_394]
    basis: "Собственник платит земельный налог (гл.31 НК РФ), арендатор — арендную плату (регион. акт). В исходнике строка «Аренда/налог ЗУ» смешивала оба платежа"
    status: project_input
    legacy: [{cell: "CF1!A24", verdict: fix}]

  - id: LAND.PURCHASE_PRICE
    name: "Цена приобретения участка / прав"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "По договору/оферте. Если сделка не заключена — оценка по аналогам (уровень 3) с обоснованием"
    status: project_input
    legacy: [{cell: "Бюджет!F17", value: "=2440190898-F22", verdict: fix, note: "из цены вычтена плата за ВРИ — зашитое число 2 440 190 898 без пояснения"}]

  - id: LAND.LEGAL_COSTS
    name: "Юридические расходы и due diligence при покупке"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_COMPANY_ACTUALS, S_EXPERT]
    basis: "По договорам с консультантами"
    status: project_input
    legacy: [{cell: "Бюджет!F18", value: 0, verdict: keep}]

  - id: LAND.AGENT_FEE_RATE
    name: "Агентское вознаграждение, доля от цены участка"
    unit: доля
    kind: scalar
    scope: project
    default: 0
    range: [0, 0.05]
    source_ids: [S_PROJECT_DOCS]
    basis: "По агентскому договору"
    status: project_input
    legacy: [{cell: "Бюджет!D19", value: 0.02, verdict: fix, note: "ставка 2% задана, но сумма F19 вбита 0 — ставка не участвует в расчёте"}, {cell: "Бюджет!F19", value: 0, verdict: replace}]

  - id: LAND.VRI_FEE
    name: "Плата за изменение ВРИ"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_MSK_VRI_593PP]
    basis: "Москва: от прироста кадастровой стоимости (ПП 593-ПП). Другие регионы: по региональному акту (regions.yaml → vri_fee_act) или 0, если платы нет. В исходнике — 5 000 руб/м² ГНС без источника"
    how_to_fill: "Рассчитывается формулой F.LAND.VRI_FEE, если регион задан; ручной ввод — только с приложением расчёта ДГИ"
    status: needs_verification
    legacy: [{cell: "Бюджет!D22", value: 5000, verdict: replace, note: "5 000 руб/м² × СПП — экспертно, без ссылки"}]

  - id: LAND.RENT_ANNUAL
    name: "Арендная плата за участок, в год"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_MSK_RENT_273PP, S_SPB_RENT_608, S_PROJECT_DOCS]
    basis: "По договору аренды или расчёт по региональной методике (кадастровая стоимость × ставка × коэффициенты)"
    status: project_input
    legacy: [{cell: "Бюджет!F21", value: 825124525.273, verdict: replace, note: "итоговая сумма за весь срок без расчёта; распределена равномерно на 7,25 года (CF1 строка 24)"}]

  - id: LAND.RENT_PAYMENT_FREQ
    name: "Периодичность арендной платы"
    unit: enum
    kind: enum
    scope: project
    options: ["ежемесячно", "поквартально авансом", "поквартально по окончании квартала"]
    default: "поквартально авансом"
    source_ids: [S_PROJECT_DOCS]
    basis: "По договору аренды. По умолчанию — поквартально авансом (решение владельца продукта 27.09.2026): платёж за квартал — в первом месяце квартала"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: LAND.RENT_INDEXATION
    name: "Индексация арендной платы, в год"
    unit: "доля/год"
    kind: scalar
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "По договору аренды (решение владельца продукта 27.09.2026): годовой процент индексации или пересчёт по региональной методике при изменении кадастровой стоимости"
    how_to_fill: "Из условий договора аренды; если индексации нет — 0"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  - id: LAND.RENT_END_MILESTONE
    name: "Веха окончания аренды участка"
    unit: enum
    kind: enum
    scope: project
    options: ["handover_start", "handover_end", "rnv_date"]
    default: "handover_start"
    source_ids: [S_EXPERT, S_PROJECT_DOCS]
    basis: "Аренда прекращается с даты передачи первого помещения: участок переходит в общую долевую собственность собственников помещений МКД (решение владельца продукта 27.09.2026). По умолчанию — handover_start первой очереди (самая ранняя дата). Правовое основание и дату сверить с договором и юристом"
    from:
      text: "Аренда прекращается с даты передачи первого помещения: участок переходит в общую долевую собственность собственников помещений МКД (решение владельца продукта 27.09.2026). По умолчанию — handover_start первой очереди (самая ранняя дата). Правовое основание и дату сверить с договором и юристом"
      url: null
    status: needs_verification
    legacy: [{cell: null, verdict: new}]

  - id: LAND.LESSOR_TYPE
    name: "Арендодатель участка"
    unit: enum
    kind: enum
    scope: project
    options: ["государственная/муниципальная", "частная"]
    default: null
    source_ids: [S_PROJECT_DOCS, S_NK_149, S_MINFIN_03_07_07_12728]
    basis: "Определяет НДС арендной платы (статья LAND_TAX_OR_RENT): аренда у органов власти и местного самоуправления — без НДС (пп.17 п.2 ст.149 НК РФ), у частного собственника — НДС по общей ставке"
    how_to_fill: "По договору аренды; обязателен при LAND.TENURE = аренда"
    status: project_input
    legacy: [{cell: null, verdict: new}]

  # Обязательства перед городом разделены на денежную компенсацию и строительство объектов (решение владельца продукта 27.09.2026):
  # у них разный НДС — платёж в бюджет не облагается, работы подрядчиков облагаются.
  - id: LAND.CITY_CASH_COMPENSATION
    name: "Обязательства перед городом: денежная компенсация (платёж в бюджет)"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "По договору о КРТ / соглашению с городом / ГПЗУ — сумма, перечисляемая в бюджет. Правообладание, а не ПИР. НДС нет — платёж в бюджет не является реализацией"
    status: project_input
    legacy: [{cell: "Бюджет!F24", value: 1260033986.66, verdict: fix, note: "«Компенсация городу» — стояла в разделе ПиР одной суммой; комментарий автора: «перенести в правообладание». Вся сумма — денежная компенсация: строительство объектов для города уже есть статьями SOCIAL_OBJECTS и ROADS_UDS, иначе двойной счёт и лишний НДС (решение владельца продукта 27.09.2026). Уточнить у авторов, нет ли внутри суммы строительства объектов"}]

  - id: LAND.CITY_OBJECTS_COST
    name: "Обязательства перед городом: строительство и передача объектов (работы подрядчиков)"
    unit: руб
    kind: scalar
    scope: project
    default: null
    source_ids: [S_PROJECT_DOCS]
    basis: "По договору о КРТ / соглашению с городом / ГПЗУ — стоимость объектов, которые застройщик строит и передаёт городу (школы, сады, дороги). Работы подрядчиков — с НДС"
    status: project_input
    legacy: [{cell: null, verdict: new, note: "в исходнике отдельной строки нет: Бюджет!F24 «Компенсация городу» — денежная компенсация (LAND.CITY_CASH_COMPENSATION)"}]

  # --- земельный налог ---

  - id: TAX.LAND_RATE
    name: "Ставка земельного налога"
    unit: доля
    kind: scalar
    scope: region
    default: null
    range: [0, 0.015]
    source_ids: [S_NK_394, S_FNS_RATES]
    basis: "Устанавливается муниципалитетом (для Москвы, СПб, Севастополя — законом города) в пределах ст.394 НК РФ. Для участков под жильё > 300 млн руб. кадастровой стоимости предел 0,3% не действует → до 1,5%"
    how_to_fill: "Сервис ФНС по ОКТМО участка; значение подставляется из regions.yaml при наличии"
    status: needs_verification
    legacy: [{cell: "CF1!D84", value: 0.002, verdict: replace, note: "0,2% без источника; для участка стоимостью 5,8 млрд предел 0,3% не применяется"}]

  - id: TAX.LAND_COEF_UP_TO_3Y
    name: "Повышающий коэффициент земельного налога (первые 3 года строительства)"
    unit: коэф
    kind: scalar
    scope: template
    default: 2
    source_ids: [S_NK_396, S_FNS_LANDCOEF_2026]
    basis: "п.15 ст.396 НК РФ: участки для жилищного строительства (кроме ИЖС) — коэф. 2 в течение 3 лет проектирования и строительства до госрегистрации прав на объект"
    status: verified
    legacy: [{cell: null, verdict: "new — в исходнике не учитывался"}]

  - id: TAX.LAND_COEF_OVER_3Y
    name: "Повышающий коэффициент земельного налога (сверх 3 лет)"
    unit: коэф
    kind: scalar
    scope: template
    default: 4
    source_ids: [S_NK_396, S_FNS_LANDCOEF_2026]
    basis: "п.15 ст.396 НК РФ: коэф. 4 — сверх трёхлетнего срока до госрегистрации прав"
