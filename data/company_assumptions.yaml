# Справочник допущений компании: стандартные значения, из которых создаётся новый проект без исходного Excel.
#
# Новый проект получает значения текущей (последней) версии и запоминает её номер. Финансист вводит только специфику
# объекта (ТЭП, цены, план продаж, смета, график СМР) и может заменить любое стандартное значение для своего проекта.
# Изменения справочника не пересчитывают существующие проекты: проект переходит на новую версию только по кнопке
# «Обновить» в самом проекте.
#
# Поля версии:
#   version  — номер версии (1, 2, …), по порядку
#   date     — дата публикации, ГГГГ-ММ-ДД
#   author   — кто опубликовал
#   note     — что изменилось в версии, простым языком
#   items    — все значения версии (полный список, а не разница с предыдущей)
#
# Поля значения:
#   param    — ID параметра из data/parameters.yaml
#   group    — раздел справочника: sales | budget | escrow | fin (порядок и номера вопросов к данным — по порядку в списке)
#   value    — стандартное значение; null — стандарта нет, значение вводится в проекте
#   status   — unverified («не проверено») | check («проверить …», что именно — в поле check) | approved («утверждено»)
#   check    — для status: check — что проверить («условия банка»)
#   from     — «Откуда»: текст и необязательная ссылка (решение владельца продукта 27.09.2026)
#   note     — необязательное пояснение
#
# Первичное наполнение (версия 1) — значения из исходного Excel «Кальк Саевой привязка КОД.xlsx» с пометкой
# «не проверено» (решение владельца продукта 27.09.2026). После ответов финансистов по проекту «Дербеневская» значения
# переводятся в «утверждено» новой версией справочника.

versions:
  - version: 1
    date: "2026-09-27"
    author: "Первичное наполнение"
    note: "Значения из исходного Excel «Кальк Саевой привязка КОД.xlsx», не проверены. Резерв — 2% по методике Минстроя, лаг раскрытия эскроу — решение владельца продукта, надбавка к ключевой ставке — расчёт из Excel, проверить условия банка."
    items:
      # ---------- Продажи ----------
      - param: OPEX.MARKETING_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: маркетинг 3,5% выручки", url: null}
      - param: OPEX.BROKERAGE_RATE
        group: sales
        value: 0.035
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: брокеридж 3,5% выручки", url: null}
      - param: SALES.PAYMENT_MIX
        group: sales
        value:
          - {product: квартиры, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: ПСН, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
          - {product: машино-места, mortgage_share: 0.9, mortgage_down_payment: 0.2, full_payment_share: 0.1, installment_share: 0, installment_months: 18, installment_down_payment: 0}
        status: unverified
        from: {text: "Исходный Excel, лист «Эскроу»: ипотека 0,7 (кредит) и первоначальный взнос 0,2, оплата 100% — 0,1, рассрочки нет; одна структура для всех продуктов", url: null}
        note: "Для апартаментов и кладовых стандарта нет: в исходном Excel их не было"
      - param: SALES.MORTGAGE_BANK_FEE_RATE
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel комиссии банку по ипотеке нет", url: null}
        note: "Нужно значение из договора с банком-партнёром"
      - param: SALES.PRICE_STAGE_UPLIFT
        group: sales
        value: null
        status: unverified
        from: {text: "В исходном Excel цена растёт на 2% в квартал без деления на рост рынка и надбавки за готовность", url: null}
        note: "Надбавки по стадиям готовности не заданы"
      # ---------- Бюджет ----------
      - param: CAPEX.CONTINGENCY_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Методика Минстроя 421/пр: 2% для объектов непроизводственного назначения", url: "https://www.consultant.ru/document/cons_doc_LAW_362957/"}
        note: "Нижняя граница для оценки участка. В исходном Excel задумано 10% от расценок СМР (48 958 руб/м² × 153 882 м² = 7,53 млрд), но Бюджет!F42 складывает площадь со ставкой — 202 840 руб. Решение владельца продукта 27.09.2026: в расчёте сервиса 2%, на 10% не переходим"
      - param: OPEX.DEV_FEE_RATE
        group: budget
        value: 0.02
        status: unverified
        from: {text: "Исходный Excel, лист «Бюджет»: вознаграждение за управление проектом 2% выручки", url: null}
      # ---------- Эскроу ----------
      - param: TIME.ESCROW_RELEASE_LAG_M
        group: escrow
        value: 3
        status: approved
        from: {text: "Решение владельца продукта 27.09.2026: 3 месяца после ввода в эксплуатацию; закон — не позднее 10 рабочих дней после представления разрешения (ч.6 ст.15.5 214-ФЗ)", url: "https://www.consultant.ru/document/cons_doc_LAW_51038/7e20edcc51ba599c70fb328204e3ac1226e7d912/"}
      # ---------- Финансирование ----------
      - param: FIN.EQUITY_SHARE
        group: fin
        value: 0.1
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: собственные средства 10% бюджета", url: null}
      - param: FIN.RATE_PREFERENTIAL
        group: fin
        value: 0.05
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: льготная ставка 5% на часть долга, покрытую эскроу", url: null}
      - param: FIN.RATE_BASE_SPREAD
        group: fin
        value: 0.0575
        status: check
        check: "условия банка"
        from: {text: "Расчёт из исходного Excel, лист «CF1»: базовая ставка 20% − ключевая 14,25% = 5,75 п.п.", url: null}
        note: "В исходном Excel базовая ставка задана целиком, без привязки к ключевой"
      - param: FIN.RATE_DISCOUNT_COEF
        group: fin
        value: null
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: скидка к ставке −2 п.п. при избыточном покрытии эскроу", url: null}
        note: "Стандарта нет: скидка считается, только если она есть в договоре банка (решение владельца продукта 28.09.2026)"
      - param: FIN.RATE_MIN
        group: fin
        value: 0.001
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: минимальная ставка 0,1%", url: null}
      - param: FIN.ESCROW_RESERVE_RATE
        group: fin
        value: 0
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: остатки эскроу для ставки не уменьшаются", url: null}
      - param: FIN.FEE_ARRANGEMENT
        group: fin
        value: 0.01
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: комиссия за выдачу 1% лимита", url: null}
      - param: FIN.FEE_COMMITMENT
        group: fin
        value: null
        status: unverified
        from: {text: "В исходном Excel комиссии за неиспользованный лимит нет", url: null}
        note: "Нужно значение из кредитного решения банка"
      - param: FIN.COLLATERAL_DISCOUNT
        group: fin
        value: 0.15
        status: unverified
        from: {text: "Исходный Excel, лист «CF1»: дисконт залоговой стоимости 15%", url: null}
