name: Наборы портала Москвы

# Какие наборы data.mos.ru годятся для автозаполнения участка (ОКН, зоны охраны).
# Запуск на сервере в России, ключ — из ~/web/.env, в журнал не выводится. Только чтение.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_mos_data.py
      - .github/workflows/mos-datasets.yml

permissions:
  contents: read

jobs:
  russia:
    name: С сервера в России
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверка через SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.SERVER_USER }}
        run: |
          set -o pipefail
          install -m 600 /dev/null key
          python3 -c 'import os,re,textwrap; k=os.environ["SSH_KEY"]; m=re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END", k, re.S); b=re.sub(r"\s+", "", m.group(2)); print(f"-----BEGIN {m.group(1)}-----"); print("\n".join(textwrap.wrap(b, 70))); print(f"-----END {m.group(1)}-----")' > key
          ssh -i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$USER_NAME@$HOST" 'python3 -' < scripts/probe_mos_data.py | tee out.txt
          rm -f key
      - name: Итог
        run: cat out.txt >> "$GITHUB_STEP_SUMMARY"
