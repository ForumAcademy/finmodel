  - version: 3
    date: "2026-09-29"
    author: "Первичное наполнение"
    note: "Ставка дисконтирования для NPV: безрисковая ставка — по кривой бескупонной доходности ОФЗ Мосбиржи на дату оценки (сервис загружает её в проекте), премия за риск — 9 п.п., не подтверждено, утверждает руководитель (решение пользователя 29.09.2026)."
