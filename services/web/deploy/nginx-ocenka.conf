# Сайт сервиса finmodel: отдельный файл для поддомена, другие сайты не затрагивает.
# Место на сервере: /etc/nginx/sites-available/ocenka (+ ссылка в sites-enabled).
# HTTPS добавит certbot командой: certbot --nginx -d ocenka.orientirgpz.com
limit_req_zone $binary_remote_addr zone=finmodel_web_req:1m rate=20r/s;

server {
    listen 80;
    server_name ocenka.orientirgpz.com;

    client_max_body_size 10m;

    location / {
        limit_req zone=finmodel_web_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
